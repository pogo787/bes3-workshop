name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Repository quality gate
        run: node tools/check-all.mjs
      - name: Hardware-free regression suite
        run: node tools/check-workshop-light.mjs
